<p>그로부터 7년 동안 규정을 만들고, 분류기준을 설계하고, 청사 이전을 치르고, 코로나19 재난기록을 수집했습니다. 올해는 ISO 30301 인증심사까지 대응했습니다. 이제 대학기록관으로 자리를 옮기며, 한 사람의 기록관리자가 한 기관에서 무엇을 할 수 있었는지 스스로 기록해 두려고 합니다. 기록관리자가 자기 일을 기록하지 않는다면 조금 이상하니까요.</p>

<h2>미리 보는 숫자</h2>
<ul>
<li>지도점검 이수율 0%에서 시작해 6년 연속 지적사항 0건</li>
<li>결재문서 목록공개율 50.2%에서 99.9%로</li>
<li>종이 기록 8,167건 전자화</li>
<li>2022년 보건복지부 산하기관 기록관리 우수사례, 2025년 국가기록관리 유공 장관표창</li>
</ul>

<h2>다시 한다면</h2>
<p>첫해에 기본계획과 함께 "측정할 지표"를 먼저 정했을 것입니다. 성과는 매년 있었지만, 같은 자로 잰 수치가 처음부터 있었다면 7년의 변화를 더 또렷하게 보여줄 수 있었을 겁니다. 대학에서는 첫날부터 그렇게 해 보려고 합니다.</p>

const ABOUT = `
<p class="lead">기록물관리전문요원입니다. 2019년부터 2026년까지 보건 분야 공공기관에서 기록관리와 정보공개를 맡았고, 이제 대학기록관에서 일합니다.</p>
<h2>이 블로그는</h2>
<p>현장에서 한 일과 그 방법을 기록합니다. 글 하나를 기록물철 하나로 보고, 분류번호와 보존기간을 붙여 서가에 꽂아 둡니다.</p>
<h2>쓰지 않는 것</h2>
<p>사람 이름, 시설 위치, 보안 사항, 기관 내부 문서 원문은 쓰지 않습니다. 수치는 공개된 것과 집계만 씁니다.</p>
<h2>글의 형식</h2>
<p>모든 글은 같은 순서를 따릅니다. 한 줄 요약, 배경, 문제, 한 일, 숫자로 본 결과, 다시 한다면, 연구 질문 한 가지, 참고한 법·표준.</p>
<h2>분류번호 읽는 법</h2>
<div class="table-wrap"><table>
<thead><tr><th>분류</th><th>코드</th></tr></thead>
<tbody>${CATS.map(c => `<tr><td>${c.name}</td><td><span class="code">${c.code}</span></td></tr>`).join("")}</tbody></table></div>
<p>예를 들어 <span class="code">CA-2026-002</span>는 커리어 아카이브 분류, 2026년 등록, 두 번째 글입니다.</p>
`;

const view = document.getElementById("view");
const nav = document.getElementById("shelf-nav");
const published = POSTS.filter(p => p.status === "published");
const esc = s => String(s).replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
const catOf = id => CATS.find(c => c.id === id);
const fmt = d => d.replaceAll("-", ".");

function renderNav(current) {
  const items = [{ href: "#home", code: "ALL", name: "전체 글", n: published.length, key: "home" }]
    .concat(CATS.map(c => ({ href: "#cat-" + c.id, code: c.code, name: c.name, n: published.filter(p => p.cat === c.id).length, key: "cat-" + c.id })))
    .concat([{ href: "#about", code: "—", name: "소개", n: "", key: "about" }]);
  nav.innerHTML = items.map(i =>
    `<a class="shelf-link" href="${i.href}"${i.key === current ? ' aria-current="page"' : ""}><span class="code">${i.code}</span><span>${i.name}</span><span class="count">${i.n}</span></a>`).join("");
}

function fileRow(p) {
  if (p.status === "planned") {
    return `<div class="file planned"><span class="file-no">${p.no}</span><div><p class="file-title">${esc(p.title)}</p><p class="file-sum">${esc(p.summary)}</p></div><span class="file-keep">작성 예정</span></div>`;
  }
  return `<a class="file" href="#p-${p.id}"><span class="file-no">${p.no}</span><div><p class="file-title">${esc(p.title)}</p><p class="file-sum">${esc(p.summary)}</p></div><span class="file-keep">${fmt(p.date)}</span></a>`;
}

function renderList(title, desc, list) {
  const pubs = list.filter(p => p.status === "published");
  const plans = list.filter(p => p.status === "planned");
  view.innerHTML = `
    <header class="page-head"><h1>${esc(title)}</h1><p>${esc(desc)}</p></header>
    ${pubs.length ? `<section class="files" aria-label="발행한 글">${pubs.map(fileRow).join("")}</section>` : `<p class="file-sum">아직 발행한 글이 없습니다.</p>`}
    ${plans.length ? `<section class="files" aria-label="작성 예정"><div class="shelf-label">작성 예정 · ${plans.length}건</div>${plans.map(fileRow).join("")}</section>` : ""}
    <footer>기록관 일지 · 글 ${published.length}편</footer>`;
}

function renderPost(p) {
  const c = catOf(p.cat);
  const idx = published.indexOf(p);
  const newer = published[idx - 1], older = published[idx + 1];
  view.innerHTML = `
    <section class="cover" aria-label="기록물철 표지">
      <div class="cover-band"><span>${p.no}</span><span>${c.name}</span><span>보존기간 ${p.keep}</span></div>
      <div class="cover-body">
        <h1>${esc(p.title)}</h1>
        <dl class="meta">
          <div><dt>등록일</dt><dd>${fmt(p.date)}</dd></div>
          ${Object.entries(p.meta).map(([k, v]) => `<div><dt>${esc(k)}</dt><dd>${esc(v)}</dd></div>`).join("")}
        </dl>
      </div>
      <div class="seal" aria-hidden="true"><div>등록<span>${p.date.slice(0, 4)}</span></div></div>
    </section>
    <article class="body">${p.body}
      <div class="tags">${p.tags.map(t => `<span class="tag">#${esc(t)}</span>`).join("")}</div>
    </article>
    <nav class="pager" aria-label="이전·다음 글">
      ${older ? `<a href="#p-${older.id}"><span class="code">이전 글 · ${older.no}</span>${esc(older.title)}</a>` : "<span></span>"}
      ${newer ? `<a href="#p-${newer.id}" style="text-align:right"><span class="code">다음 글 · ${newer.no}</span>${esc(newer.title)}</a>` : "<span></span>"}
    </nav>`;
}

function route() {
  const h = location.hash.slice(1) || "home";
  if (h.startsWith("p-")) {
    const p = published.find(x => "p-" + x.id === h);
    if (p) { renderNav("cat-" + p.cat); renderPost(p); window.scrollTo(0, 0); document.title = p.title + " · 기록관 일지"; return; }
  }
  document.title = "기록관 일지";
  if (h.startsWith("cat-")) {
    const c = CATS.find(x => "cat-" + x.id === h);
    if (c) { renderNav(h); renderList(c.name, c.desc, POSTS.filter(p => p.cat === c.id)); return; }
  }
  if (h === "about") {
    renderNav("about");
    view.innerHTML = `<header class="page-head"><h1>소개</h1></header><article class="body">${ABOUT}</article>`;
    return;
  }
  renderNav("home");
  renderList("전체 글", "공공기관 7년의 기록을 연도별로 정리하고, 대학기록관에서의 일과 연구를 이어서 씁니다.", POSTS);
}
window.addEventListener("hashchange", route);
route();
</script>
